# Ready-made icons for plugin authors, shown on the Tools page (authors/tools/).
# Anyone may use them in their plugin, for anything (they're CC0).
#
# Each one is eight lines of eight characters, as the SDK reads an icon's .txt
# file: # is a pixel and . is empty. Keep the top row or the right column clear
# when you can, so rows on the menu don't run together. The emoji is only a
# hint shown beside the name; the cart never sees it.

