# All the words on the Parrot Cart plugins site, plus the fixed sentences in
# our replies on submission issues and pull requests. Edit the text inside
# the quotes. The comment above each line says where it shows.
#
#   - Keep every {placeholder} in braces. The site fills it in with a name,
#     a number or a link. Each comment lists the ones that line can use.
#   - A link is [text](address). Code is `code`. Bold is **bold**.
#   - Type < > & and quotes as they are. Straight apostrophes turn curly.
#   - Don't delete a line. The build stops and names any line it can't find.
#
# To preview, run  python3 tools/build_site.py --out _site  and open
# _site/index.html. Or edit this file on GitHub. The site rebuilds when the
# change reaches main.


# ==== The catalogue (the home page) ===========================================

[home]
# The browser tab
page_title = "Parrot Cart plugins"
# The summary search engines show
description = "Free plugins for Parrot Cart, the ColecoVision cartridge with a microSD card. Download a .CVP file and copy it to the /PLUGINS folder."

[home.hero]
# The big headline. Its last two words stay on one line.
title = "Plugins for your Parrot Cart"
# The line under the headline
lead = "Emulators, utilities and more to enhance your ColecoVision."
# The first button under the headline
browse_button = "Browse plugins"
# The second button under the headline
submit_button = "Submit a plugin"
# Under the TV picture beside the headline
card_caption = "The cart's Plugins page"
# The tag at the right under the TV picture
card_code = "/PLUGINS"
# The TV picture's description for screen readers
card_alt = "A TV showing the cart's Plugins page with these plugins"

[home.browse]
# The plugin list's heading
title = "Browse Plugins"
# The search box's label
search_label = "Search by name or file type"
# In the Opens column, for a plugin that opens no files
no_files = "An app"
# In the Needs column, for a plugin that needs nothing extra
needs_nothing = "None"
# When a search finds nothing
no_match = "No plugins match. Try a file type like .nes, or clear the search."

[home.browse.columns]
# The plugin list's column headings (also the labels on a phone)
plugin = "Plugin"
id = "ID"
opens = "Opens"
needs = "Needs"
version = "Version"
size = "Size"

[home.files]
# The heading over the Before / Copied / After pictures
title = "How plugins work with files"
# Under that heading
lead = "The card only shows files that are associated with a plugin."
# The tab list's name for screen readers
tabs_label = "Step by step"
# The first tab. Its text takes {ext} and {folder}.
before = "Before"
before_text = "You have three {ext} files in {folder}, but the menu hides them."
# The second tab. Its text takes {file}, the .CVP's name.
copied = "Copied"
copied_text = "Copy {file} to /PLUGINS, and the plugin shows up on the Plugins page."
# The tag under the second tab's picture
copied_code = "/PLUGINS"
# The third tab
after = "After"
after_text = "Now your files show up with the plugin's icon. Press A to open one."

[home.install]
# The install steps' heading
title = "No installer. Manage your plugins on the cartridge."
# Under that heading
lead = "Three easy steps."

# The install steps, in order. Each has a title and a line under it.
[[home.install.steps]]
title = "Download the .CVP"
text = "You'll find it on the plugin's page on this site."

[[home.install.steps]]
title = "Copy it to /PLUGINS"
text = "That folder is on the cart's microSD card."

[[home.install.steps]]
title = "Start it from Plugins"
text = "Press B for Home, open Plugins, pick the plugin and press A."

[home.flash]
# The dark band. The big number 10 shows first, then this line.
title = "plugins stay ready on the cart"

# The dark band's rows: a bold label on the left, a sentence on the right.
[[home.flash.rows]]
bold = "The first time you start one"
text = "The cart copies it into a 1 MB slot. That only happens once for each version."

[[home.flash.rows]]
bold = "A new version"
text = "It goes into the old version's slot."

[[home.flash.rows]]
bold = "When every slot is full"
text = "The next plugin replaces the one you used longest ago."

[[home.flash.rows]]
bold = "Removing a plugin"
text = "That frees up the plugin's slot."

[home.close]
# The last band's heading
title = "Add your plugin by submitting a GitHub issue in the registry."
# Under that heading
text = "We'll check your release and list it here."
# Its two buttons
submit_button = "Submit a plugin"
json_button = "registry.json"


