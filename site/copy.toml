[[submit.steps.boxes]]
title = "The check"
text = "We read your files and reply on the issue."

[[submit.steps.boxes]]
title = "Your listing"
text = "We make your plugin's listing from your release."

[[submit.steps.boxes]]
title = "A review"
text = "We look it over and approve it."

[[submit.steps.boxes]]
title = "This site"
