# ---- The README page ----

[authors.readme.hero]
# Part 1's heading
title = "One README for the web and the TV"
# The line under the headline
lead = "Write README.md once. It shows on your plugin's page here, and the SDK adds it to the .CVP for the cart."
# Under the TV picture
card_caption = "A README on the cart"
# The tag at the right under the TV picture
card_code = "30 × 19"
# The example README drawn on the TV picture, as Markdown
sample = '''
# Star Sweeper

A small game for Parrot Cart. Clear the sky before the sun comes up.

## Controls

- Joystick: move
- Left button: sweep
- `*`: pause

## Credits

Code and art by **A. Author**. The sound driver comes from the [Parrot Cart SDK](https://example.com/sdk).

## Source

https://github.com/author/star-sweeper
'''

[authors.readme.write]
# The section's heading
title = "What to write"
# Under that heading
lead = "People read it on the TV, often with no computer nearby."

# The tips, each a title and a line
[[authors.readme.write.rows]]
title = "What it does"
text = "Start with a line or two about what it does. The cart shows 19 lines at a time."

[[authors.readme.write.rows]]
title = "How to use it"
text = "List the controls, and say which folder the files go in."

[[authors.readme.write.rows]]
title = "Credits"
text = "Under a Credits heading, say whose work it uses. This part is required."

[[authors.readme.write.rows]]
title = "Source"
text = "Add a line with the word “source” and a link to your code. This part is required too."

[authors.readme.convert]
# The section's heading
title = "How the SDK converts it"
# Under that heading
lead = "The SDK converts README.md when it builds your plugin."
# The table's column headings
columns = ["Markdown", "On the cart"]
# The commands in the box under the table
command = '''
cvcart_plugin(sweeper ID author.sweeper NAME "Star Sweeper" VERSION 1.0.0
               README README.md)

python3 cvreadme.py README.md    # prints what the cart will show'''
# The small note under the box. Takes {starter_kit}, the link.
note = "Both come with {starter_kit}. If the text is over 16384 bytes, the SDK cuts it at the end of a line and adds a last line that says so."

# The table's rows: what Markdown becomes on the cart
[[authors.readme.convert.rows]]
markdown = "A heading"
cart = "It's shown in capitals, with a blank line before and after."

[[authors.readme.convert.rows]]
markdown = "A paragraph"
cart = "It's wrapped to 30 characters."

[[authors.readme.convert.rows]]
markdown = "A list"
cart = "Each item starts with `-` or `1.`, and wrapped lines are indented under the first word."

[[authors.readme.convert.rows]]
markdown = "A link"
cart = "You get the text, then the URL. A long URL goes on its own line."

[[authors.readme.convert.rows]]
markdown = "Code"
cart = "Inline code stays as plain text. A code block stays as it is, but each line is cut at 30 characters."

[[authors.readme.convert.rows]]
markdown = "Bold and italics"
cart = "They're dropped, since the cart only has one style of text."

[[authors.readme.convert.rows]]
markdown = "An image"
cart = "It shows up as `[image: alt]`."

[[authors.readme.convert.rows]]
markdown = "A table"
cart = "Each cell becomes a `header: value` line, row by row."

[[authors.readme.convert.rows]]
markdown = "Raw HTML"
cart = "The tags are dropped, but the text inside them stays."

[[authors.readme.convert.rows]]
markdown = "Non-ASCII characters"
cart = "Curly quotes, dashes and accented letters become plain look-alikes. Anything else becomes `?`."

[authors.readme.format]
# The section's heading
title = "The format in the .CVP"
# Under that heading
lead = "You only need this if you build a .CVP without the SDK."
# The table's column headings
columns = ["Where", "Type", "What"]

[[authors.readme.format.rows]]
where = "Offset 280"
type = "u32, little-endian"
what = "Where the text starts, counted from the start of the file. A 0 means there's no README."

[[authors.readme.format.rows]]
where = "Offset 284"
type = "u32, little-endian"
what = "The length of the text in bytes, up to 16384."

[[authors.readme.format.rows]]
where = "The text"
type = "After the image"
what = "It can only hold printable ASCII (0x20 to 0x7E) and line feeds. No line can be over 30 characters, and the last line ends with a line feed."

[[authors.readme.format.rows]]
where = "SHA-256"
type = "Unchanged"
what = "The image's hash doesn't include the README. Changing the README won't make the cart copy the plugin again."

[authors.readme.checks]
# The section's heading
title = "What we check"
# Under that heading
lead = "We never change your text. Your page shows it exactly as it is in the .CVP."
# The table's column headings
columns = ["Check", "Rule", "If it fails"]

[[authors.readme.checks.rows]]
check = "In bounds"
rule = "The text starts after the image and ends inside the file."
result = "We can't list it."

[[authors.readme.checks.rows]]
check = "Length"
rule = "Up to 16384 bytes."
result = "We can't list it."

[[authors.readme.checks.rows]]
check = "Characters"
rule = "Only 0x20 to 0x7E and line feeds, with no tabs or carriage returns."
result = "We can't list it."

[[authors.readme.checks.rows]]
check = "Width"
rule = "Up to 30 characters per line."
result = "We can't list it."

[[authors.readme.checks.rows]]
check = "No README at all"
rule = "Both fields are 0. Plugins built before the README existed look like this."
result = "We list it, with a note on its page."

[authors.readme.web]
# The section's heading
title = "On your plugin's page"
# Under that heading
lead = "We show the README.md from your release's tag, with GitHub's Markdown formatting."
# The table's column headings
columns = ["Part", "What happens"]

[[authors.readme.web.rows]]
part = "Shown"
what = "Headings, lists, task lists, tables, code, quotes and links."

[[authors.readme.web.rows]]
part = "Images"
what = "They show up as links, because this site doesn't load anything from other sites."

[[authors.readme.web.rows]]
part = "Raw HTML"
what = "It's dropped, along with any scripts or styles, but the text stays."

[[authors.readme.web.rows]]
part = "Links"
what = "Only https links work. Relative links point to your repo at the release's tag."

[[authors.readme.web.rows]]
part = "Size"
what = "It can be up to 64 KB. If it's bigger, we link to it instead."

