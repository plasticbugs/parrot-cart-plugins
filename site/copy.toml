# ==== The submit page ==========================================================

[submit]
# The browser tab
page_title = "Submit a plugin: Parrot Cart plugins"
# The summary search engines show
description = "Get your plugin listed on Parrot Cart plugins. Open a GitHub issue with your repo, and we'll check your release."

[submit.hero]
# The big headline
title = "Submit an Issue in the repository to add your Plugin"
# The line under the headline
lead = "Open an issue with a link to your repo. We'll check your latest release and add your plugin to the site."
# The first button under the headline (it opens the GitHub form)
issue_button = "Open an issue"
# The second button under the headline
rules_button = "See the requirements"

[submit.steps]
# The boxes' name for screen readers
label = "From your release to the cart"
# The small line under the boxes
note = "We never run anything from your repo."

# The boxes beside the headline, in order. The last one loops back.
[[submit.steps.boxes]]
title = "Your release"
text = "You publish a .CVP with your README inside it."

[[submit.steps.boxes]]
title = "An issue"
text = "You open an issue with your repo and a one-line description."

[[submit.steps.boxes]]
title = "The check"
text = "We read your files and reply on the issue."

[[submit.steps.boxes]]
title = "Your listing"
text = "We make your plugin's listing from your release."

[[submit.steps.boxes]]
title = "A review"
text = "We look it over and approve it."

[[submit.steps.boxes]]
title = "This site"
text = "Your plugin gets a page here."

[[submit.steps.boxes]]
title = "SD cards"
text = "People copy your plugin to /PLUGINS on their cards."

[[submit.steps.boxes]]
title = "Your next release"
text = "We spot it within a day, and it goes through the same steps."

[submit.requirements]
# The requirements' heading
title = "Requirements"

# The requirements, a bold start and the rest. They can use {readme_page} and
# {screenshots_page}, the links to those help pages, and {browse_page}, the
# link to the All plugins page.
[[submit.requirements.rows]]
title = "The .CVP"
text = "Its image can be up to 2 MB less 4K."

[[submit.requirements.rows]]
title = "The README"
text = "It goes [inside the .CVP]({readme_page})."

[[submit.requirements.rows]]
title = "Screenshots"
text = "You can add up to three, as [256 × 192 PNGs]({screenshots_page})."

[[submit.requirements.rows]]
title = "Your repo"
text = "It has to be public and have a license."

[[submit.requirements.rows]]
title = "Its type"
text = "Pick one or two in the form, and tick what your plugin works with. People use them to filter [all the plugins]({browse_page})."

[submit.check]
# The last band's heading
title = "Check your plugin before you release it"
# Under that heading
text = "Clone this site's repo and run this command. It shows your plugin's details and any problem that would keep it from loading on the cart."
# The command in the box
command = "python3 tools/cvp.py YOURPLUGIN.CVP"


