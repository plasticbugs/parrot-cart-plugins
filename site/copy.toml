# ==== Our replies on GitHub ====================================================
# These are GitHub Markdown, so **bold** and `code` work as GitHub shows them.

[bot]
# A repo and its tag, used as {where} below. Takes {repo} and {tag}.
repo_at_tag = "{repo} at `{tag}`"
# The first line of the reply. Takes {where} and {result}, one of the results below.
checked = "**We checked {where}. {result}**"
# The first line when GitHub couldn't be read. Takes {where}.
checked_retry = "**We couldn't finish checking {where}.**"
# The results
passed = "It passed."
new_version = "It's a new version."
nothing_new = "It passed, but there's nothing new to add."
failed = "It didn't pass."
# Over the list of problems
errors = "Here's what needs fixing:"
# Over the list of problems when GitHub couldn't be read
errors_retry = "Here's what went wrong:"
# Over the list of warnings
warnings = "These are worth a look, but they don't stop your plugin:"
# Over the list of what the plugin's page will show
page_shows = "Your plugin's page will show:"
# One line of that list. Takes {name} and {parts}, the parts below joined by commas.
page_shows_line = "{name}: {parts}"
# The parts
shows_cart_readme = "the README from the .CVP"
shows_no_cart_readme = "no README on the cart"
shows_readme = "README.md"
shows_readme_link = "a link to the README"
shows_notes = "your release notes"
shows_no_notes = "no release notes"
shows_one_screenshot = "1 screenshot"
# Takes {count}
shows_screenshots = "{count} screenshots"
shows_no_screenshots = "no screenshots"
# The last line, after a pass
next_passed = "Next, we'll make sure it has no commercial game art or ROMs, and then we'll add it to the site. We'll close this issue when your plugin is listed."
# The last line, when GitHub couldn't be read
next_retry = "This isn't a problem with your plugin. Edit this issue, and we'll check it again."
# The last line, after a fail
next_failed = "Fix these, and publish a new release if the .CVP changed. Then edit this issue, and we'll check it again."

[bot.table]
# The table's column headings
file = "File"
plugin = "Plugin"
id = "ID"
version = "Version"
result = "Result"
# The Result column's words
new = "new"
update = "update"
same = "already listed"
unlisted = "not listed yet"
fix = "needs fixing"
hold = "on hold"
ok = "ok"

[bot.pr]
# A pull request's title for a new plugin. Takes {plugins}, names and versions.
title_new = "Add {plugins}"
# A pull request's title for a new version. Takes {plugins}.
title_update = "Update {plugins}"
# Over the checklist
checklist_intro = "Before you merge, check that:"
# The checklist, one box each
checklist = [
    "The repo and the release have no commercial game art, ROMs or other files the author can't share.",
    "The description is accurate.",
    "The screenshots in `plugins/<id>/` show the plugin itself, with no commercial game art.",
    "The README and release notes are fine to show on the site.",
]
# One line per plugin under the checklist. Takes {id}, {repo_url}, {tag}, {download_url} and {sha256}.
source_line = "`{id}` comes from {repo_url}, release `{tag}`. The file is {download_url}, with SHA-256 `{sha256}`."
