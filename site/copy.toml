# All the words on the Parrot Cart plugins site, plus the fixed sentences in
# our replies on submission issues and pull requests. Edit the text inside
# the quotes. The comment above each line says where it shows.
#
#   - Keep every {placeholder} in braces. The site fills it in with a name,
#     a number or a link. Each comment lists the ones that line can use.
#   - A link is [text](address). Code is `code`. Bold is **bold**.
#   - Type < > & and quotes as they are. Straight apostrophes turn curly.
#   - Don't delete a line. The build stops and names any line it can't find.
#
# To preview, run  python3 tools/build_site.py --out _site  and open
# _site/index.html. Or edit this file on GitHub. The site rebuilds when the
# change reaches main.


# ==== The catalogue (the home page) ===========================================

[home]
# The browser tab
page_title = "Parrot Cart plugins"
# The summary search engines show
description = "Free plugins for Parrot Cart, the ColecoVision cartridge with a microSD card. Download a .CVP file and copy it to the /PLUGINS folder."

[home.hero]
# The big headline. Its last two words stay on one line.
title = "Plugins for your Parrot Cart"
# The line under the headline
lead = "Emulators, utilities and more for Parrot Cart, the ColecoVision flash cartridge."
# The first button under the headline
browse_button = "Browse plugins"
# The second button under the headline
submit_button = "Submit a plugin"
# Under the TV picture beside the headline
card_caption = "The cart's Plugin Manager"
# The tag at the right under the TV picture
card_code = "/PLUGINS"
# The TV picture's description for screen readers
card_alt = "A TV showing the cart's Plugin Manager with these plugins"

[home.about]
# The section under the headline that says what the cart is: its heading,
# its line, and the button to the shop (registry.config.json shop_url)
title = "What is Parrot Cart?"
# The bigger line right under that heading
big = "More than a flash cart."
text = "It's a flash cartridge for the ColecoVision that plays your games and movies from a microSD card. It also runs plugins, which are programs that turn the console into something new."
shop_button = "Get a Parrot Cart"
# The hardware list beside it, for the technical
specs_title = "The hardware"

[[home.about.specs]]
name = "Chip"
value = "A Raspberry Pi RP2350, the chip in the Pico 2, with two Arm Cortex-M33 cores at 150 MHz. One core talks to the console, and the other runs the plugin."

[[home.about.specs]]
name = "Memory"
value = "520 KB of RAM on the chip, plus 8 MB of PSRAM."

[[home.about.specs]]
name = "Flash"
value = "16 MB. A plugin runs from RAM or straight from flash."

[[home.about.specs]]
name = "Storage"
value = "A microSD card holds your games, movies, plugins and saves."

[[home.about.specs]]
name = "USB‑C"
value = "Gamepads, keyboards, mice and MIDI keyboards plug in through a powered hub. If you plug the cart into a computer instead, a plugin can send music to it as MIDI."

[[home.about.specs]]
name = "The console"
value = "Plugins use the ColecoVision's TMS9918A video chip for the picture and its SN76489 sound chip for sound."

[[home.about.specs]]
name = "Plugins"
value = ".CVP files up to 2 MB less 4K, written in C with the Raspberry Pi Pico SDK, or in Lua."

[home.browse]
# The plugin list's heading. The list shows the newest plugins.
title = "Browse plugins"
# Under that heading
lead = "The latest releases."
# The button under the list, to the page with every plugin (plugins/)
all_button = "Browse all available plugins"
# In the Opens column, for a plugin that opens no files
no_files = "An app"

[home.browse.columns]
# The plugin list's column headings (also the labels on a phone)
plugin = "Plugin"
id = "ID"
opens = "Opens"
version = "Version"
size = "Size"

[home.files]
# The heading over the Before / Copied / After pictures
title = "How plugins work with files"
# Under that heading
lead = "The menu hides a type of file until you add a plugin that opens it."
# The tab list's name for screen readers
tabs_label = "Step by step"
# The first tab. Its text takes {ext} and {folder}.
before = "Before"
before_text = "You have three {ext} files in {folder}, but the menu hides them and the folder."
# The tag under the first tab's picture: the card's top folder
before_code = "/"
# The second tab. Its text takes {file}, the .CVP's name.
copied = "Copied"
copied_text = "Copy {file} to /PLUGINS, and the plugin shows up in the Plugin Manager."
# The tag under the second tab's picture
copied_code = "/PLUGINS"
# The third tab
after = "After"
after_text = "Now your files show up with the plugin's icon. Press A to open one."

[home.install]
# The install steps' heading
title = "No installer. Manage your plugins on the cartridge."
# Under that heading
lead = "Three easy steps."

# The install steps, in order. Each has a title and a line under it.
[[home.install.steps]]
title = "Download the .CVP"
text = "You'll find it on the plugin's page on this site."

[[home.install.steps]]
title = "Copy it to /PLUGINS"
text = "That folder is on the cart's microSD card. A folder inside it, like /PLUGINS/ARCADE, gets a row on Home."

[[home.install.steps]]
title = "Start it"
text = "Press B for Home, open Apps, pick the plugin and press A. A plugin that opens files starts when you open one of them."

[home.flash]
# The dark band. The big number 10 shows first, then this line.
title = "flash slots keep plugins ready to start"

# The dark band's rows: a bold label on the left, a sentence on the right.
[[home.flash.rows]]
bold = "The first time you start one"
text = "The cart copies it into a 1 MB slot, or two for a plugin over 1 MB. That only happens once for each version."

[[home.flash.rows]]
bold = "A new version"
text = "It goes into the old version's slot."

[[home.flash.rows]]
bold = "When every slot is full"
text = "The next plugin replaces the one copied longest ago."

[[home.flash.rows]]
bold = "Removing a plugin"
text = "That frees up the plugin's slot."

[home.close]
# The last band's heading
title = "Add your plugin by submitting a GitHub issue in the registry."
# Under that heading
text = "We'll check your release and list it here."
# Its two buttons
submit_button = "Submit a plugin"
json_button = "registry.json"


