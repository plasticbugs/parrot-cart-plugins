# ---- The icons page ----

[authors.icons.hero]
# Part 3's heading
title = "Two 8 × 8 icons"
# The line under the headline
lead = "You need one for the plugin and one for the files it opens. Each pixel is on or off, and the menu picks the color."
# The two buttons under it
editor_button = "Open the icon editor"
gallery_button = "Pick a ready-made icon"
# Under the TV picture
card_caption = "Each plugin's icon on the Plugins page"
card_code = "/PLUGINS"

[authors.icons.spec]
# The section's heading
title = "What an icon is"
# Under that heading
lead = "Both icons together take 16 bytes of the .CVP's header."
# The table's column headings
columns = ["", "Rule"]

[[authors.icons.spec.rows]]
name = "Size"
rule = "8 × 8 pixels. Each pixel is on or off."

[[authors.icons.spec.rows]]
name = "The plugin's icon"
rule = "8 bytes at header offset 264. It shows next to the plugin on the Plugins page and in Open with."

[[authors.icons.spec.rows]]
name = "The file icon"
rule = "8 bytes at header offset 272. It shows next to each file the plugin opens."

[[authors.icons.spec.rows]]
name = "One byte per row"
rule = "The top row comes first. Bit 7 is the left pixel."

[[authors.icons.spec.rows]]
name = "Color"
rule = "The menu picks it. Plugin icons are magenta and file icons are light green. The background is black, or dark blue on the selected row."

[[authors.icons.spec.rows]]
name = "All zeros"
rule = "That means no icon. The menu shows its own plug or plain file icon instead."

[[authors.icons.spec.rows]]
name = "Per screen"
rule = "The menu shows up to seven plugin icons and six different file icons on a page. Any more get the plug and the plain file icon."

[authors.icons.txt]
# The section's heading
title = "The .txt file the SDK reads"
# Under that heading
lead = "It's eight lines of eight characters. A # is a pixel and a . is empty."
# The heading over the example file
file_title = "padtest_icon.txt"
# The heading over the same icon as bytes
header_title = "In the header"
# The small note under the bytes
note = "The SDK ignores blank lines and spaces around a line. Anything else stops the build."
# The commands in the box under them
command = '''
cvcart_plugin(padtest ID author.padtest NAME "Pad Test" VERSION 1.0.0
               ICON padtest_icon.txt FILE_ICON padtest_file_icon.txt)

mkcvp.py IN.uf2 OUT.cvp ... --icon padtest_icon.txt --file-icon padtest_file_icon.txt'''

[authors.icons.design]
# The section's heading
title = "Tips for a clear icon"
# Under that heading
lead = "Menu rows touch, so there's no gap between one icon and the next."

[[authors.icons.design.rows]]
title = "Leave an edge clear"
text = "The menu's icons leave the top row and the right column empty, so they don't run into each other."

[[authors.icons.design.rows]]
title = "Use solid shapes"
text = "There's only one color, so the outline does the work. Solid shapes look better than thin lines on a TV."

[[authors.icons.design.rows]]
title = "Check it on the selected row"
text = "The selected row is dark blue. The editor shows both backgrounds."

