# All the words on the Parrot Cart developer portal (developers/ on the
# plugins site), except the docs themselves. Those are the Markdown files in
# the starter kit, shown as they are. Edit the text inside the quotes. The
# comment above each line says where it shows.
#
#   - Keep every {placeholder} in braces. The portal fills it in with a name,
#     a number or a link. Each comment lists the ones that line can use.
#   - A link is [text](address). Code is `code`. Bold is **bold**.
#   - Type < > & and quotes as they are. Straight apostrophes turn curly.
#   - Don't delete a line. The build stops and names any line it can't find.
#
# To preview, build the plugins site and then the portal into it:
#   python3 tools/build_site.py --out _site
#   python3 tools/build_dev.py --kit PATH_TO_THE_STARTER_KIT --out _site/developers
# and open _site/developers/index.html.


