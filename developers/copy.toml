fallback_code = "256 × 192"

[packaging.screenshots.spec]
# The section's heading
title = "Requirements"
# Under that heading
lead = "The console's picture is 256 × 192 pixels."
# The table's column headings
columns = ["", "Rule"]

# The rules. They can use {width}, {height} and {max_kb}.
[[packaging.screenshots.spec.rows]]
name = "How many"
rule = "Up to three."

[[packaging.screenshots.spec.rows]]
name = "Format"
rule = "A PNG, not animated."

[[packaging.screenshots.spec.rows]]
name = "Size"
rule = "Exactly {width} × {height} pixels, with no border, scaling or filters."

[[packaging.screenshots.spec.rows]]
name = "File size"
rule = "Up to {max_kb} KB each. A real screen is usually only a few KB."

[[packaging.screenshots.spec.rows]]
name = "Names"
rule = "`screenshot-1.png`, `screenshot-2.png` and `screenshot-3.png`, in lowercase."

[[packaging.screenshots.spec.rows]]
name = "Where"
rule = "Attach them to your GitHub release, next to the .CVP."

[packaging.screenshots.show]
# The section's heading
title = "What to show"

[[packaging.screenshots.show.rows]]
title = "The plugin itself"
text = "Show the plugin's screens, starting with the one people see most."

[[packaging.screenshots.show.rows]]
title = "Nothing you can't share"
text = "For an emulator, show homebrew or your own test files instead of a commercial game."

[[packaging.screenshots.show.rows]]
title = "One set per release"
text = "If a release has several .CVP files, they share the screenshots."

[packaging.screenshots.taking]
# The section's heading
title = "How to take one"
# Under that heading
lead = "Use any ColecoVision emulator that can save the picture at its real size."

[[packaging.screenshots.taking.rows]]
title = "Save at 1x"
text = "Turn off scaling, filters and scanlines."

[[packaging.screenshots.taking.rows]]
title = "Crop the border"
text = "If the file is bigger than 256 × 192, it includes the border. Crop it out."

[[packaging.screenshots.taking.rows]]
title = "Save an indexed PNG"
text = "The console only has 15 colors, so an indexed PNG is exact and small."

[packaging.screenshots.refused]
# The section's heading
title = "Screenshots we can't use"
# Under that heading
lead = "We can't list your plugin until every screenshot is right. We'll tell you which one has a problem and why."
# The table's column headings
columns = ["Problem", "For example"]

[[packaging.screenshots.refused.rows]]
what = "The wrong size"
example = "640 × 480, 280 × 216 with the border, or a photo of the TV."

[[packaging.screenshots.refused.rows]]
what = "Not a PNG"
example = "A renamed JPEG, a broken upload or an animated PNG."

[[packaging.screenshots.refused.rows]]
what = "Over 100 KB"
example = "It was usually scaled up, or saved in full color from a photo."

[[packaging.screenshots.refused.rows]]
what = "A fourth screenshot"
example = "`screenshot-4.png` or higher."

[packaging.screenshots.used]
# The section's heading
title = "Where they show up"
# Under that heading
lead = "They show up in these places once your plugin is listed."
# The table's column headings
columns = ["Place", "How"]

[[packaging.screenshots.used.rows]]
place = "Your plugin's page"
how = "Each one sits in a TV frame, scaled up without blur."

[[packaging.screenshots.used.rows]]
place = "The plugin list"
how = "The first one shows as a thumbnail."

[[packaging.screenshots.used.rows]]
place = "registry.json"
how = "It links to each one, for apps that install plugins."

# ---- Part 3, icons ----

[packaging.icons.hero]
# Part 3's heading
title = "Two 8 × 8 icons"
# The line under the headline
lead = "You need one for the plugin and one for the files it opens. Each pixel is on or off, and the menu sets the color."
# The two buttons under it
editor_button = "Open the icon editor"
gallery_button = "Pick a ready-made icon"
# Under the TV picture
card_caption = "Plugin icons in the Plugin Manager"
card_code = "/PLUGINS"

[packaging.icons.spec]
# The section's heading
title = "What an icon is"
# Under that heading
lead = "Both icons together take 16 bytes of the .CVP's header."
# The table's column headings
columns = ["", "Rule"]

[[packaging.icons.spec.rows]]
name = "Size"
rule = "8 × 8 pixels. Each pixel is on or off."

[[packaging.icons.spec.rows]]
name = "The plugin's icon"
rule = "8 bytes at header offset 264. It shows next to the plugin in Apps, in its group on Home, in the Plugin Manager and in Open with. A plugin that only opens files shows it in Open with, and the plug everywhere else."

[[packaging.icons.spec.rows]]
name = "The file icon"
rule = "8 bytes at header offset 272. It shows next to each file the plugin opens."

[[packaging.icons.spec.rows]]
name = "One byte per row"
rule = "The top row comes first. Bit 7 is the left pixel."

[[packaging.icons.spec.rows]]
name = "Color"
rule = "The menu sets it. Plugin icons are magenta and file icons are light green. The background is black, or dark blue on the selected row."

[[packaging.icons.spec.rows]]
name = "All zeros"
rule = "That means no icon. The menu shows its window icon for a plugin that starts on its own, the plug in Open with, and the plain file icon for a file."

[[packaging.icons.spec.rows]]
name = "Per screen"
rule = "A page that lists plugins shows up to 22 different plugin icons, and Open with up to 7. A folder shows up to 6 different file icons. Any more get the menu's icons."

[packaging.icons.txt]
# The section's heading
title = "The .txt file the SDK reads"
# Under that heading
lead = "It's eight lines of eight characters. A # is a pixel and a . is empty."
# The heading over the example file
file_title = "padtest_icon.txt"
# The heading over the same icon as bytes
header_title = "In the header"
# The small note under the bytes
note = "The SDK ignores blank lines and spaces around a line. Anything else stops the build."
# The commands in the box under them
command = '''
cvcart_plugin(padtest ID author.padtest NAME "Pad Test" VERSION 1.0.0
               ICON padtest_icon.txt FILE_ICON padtest_file_icon.txt)

mkcvp.py IN.uf2 OUT.cvp ... --icon padtest_icon.txt --file-icon padtest_file_icon.txt'''

[packaging.icons.design]
# The section's heading
title = "Tips for a clear icon"
# Under that heading
lead = "Menu rows touch, so there's no gap between one icon and the next."

[[packaging.icons.design.rows]]
title = "Leave an edge clear"
text = "The menu's icons leave the top row, the bottom row and the right column empty, so they don't run into each other or into the name beside them."

[[packaging.icons.design.rows]]
title = "Use solid shapes"
text = "There's only one color, so the outline does the work. Solid shapes look better than thin lines on a TV."

[[packaging.icons.design.rows]]
title = "Check it on the selected row"
text = "The selected row is dark blue. The editor shows both backgrounds."

[packaging.icons.family]
