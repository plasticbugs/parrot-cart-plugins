name: Submit a plugin
description: Add your Parrot Cart plugin to the site. You can also use it for another plugin from the same repo.
title: "Plugin: "
labels: ["plugin-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which GitHub repo your plugin is in. We'll check your latest
        release and reply here. If it passes, we'll add your plugin to the
        registry. We only read your files, and we never run anything from
        your repo.

        After that, we'll pick up your new releases automatically.

        Your plugin's page shows your README, your release notes and up to
        three screenshots. Attach the screenshots to the release as
        `screenshot-1.png`, `screenshot-2.png` and `screenshot-3.png` (PNG,
        256 × 192, 100 KB max each).

        You can read more on the Packaging page at
        https://plasticbugs.github.io/parrot-cart-plugins/developers/packaging/
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Type it as owner/repo. It has to be public.
      placeholder: yourname/your-plugin
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Release tag
      description: Leave it empty to use your latest release. We can't use drafts or pre-releases.
      placeholder: v1.0.0
    validations:
      required: false
  - type: input
    id: description
    attributes:
      label: Short description
      description: Describe your plugin in one line, up to 160 characters.
      placeholder: Player for .xyz files, with USB pad support
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      description: We can only list your plugin if all of these are true.
      options:
        - label: The repo is public and has a LICENSE file.
          required: true
        - label: The repo and the release, including screenshots, have no commercial game art, ROMs or other files I don't have the right to share.
          required: true
        - label: You may show this release's README, release notes and screenshots on the plugin's page.
          required: true
