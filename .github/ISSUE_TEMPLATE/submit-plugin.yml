name: Submit a plugin
description: Add your Parrot Cart plugin (.CVP) to the registry, or a new plugin from the same repository.
title: "Plugin: "
labels: ["plugin-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Give the GitHub repository that publishes your plugin. A bot reads the
        repository and the `.CVP` file(s) on its release, checks them the way
        the cart's menu does, and replies here. If everything passes, it opens a
        pull request adding your plugin, and a maintainer merges it. Nothing
        from your repository is ever run: the bot only reads files.

        New versions are found by themselves once a plugin is listed: publish a
        release with the new `.CVP` and an update pull request follows.

        The plugin's page shows what the release holds, copied into the
        registry: the README inside the `.CVP` (as the cart shows it), the
        repository's `README.md`, the release's notes, and up to three
        screenshots attached to the release as `screenshot-1.png` to
        `screenshot-3.png` (PNG, exactly 256 x 192, 100 KB each at most).
        What each needs: https://plasticbugs.github.io/parrot-cart-plugins/authors/
  - type: input
    id: repo
    attributes:
      label: Repository
      description: owner/repo on GitHub. It must be public.
      placeholder: yourname/your-plugin
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Release tag
      description: Leave empty for the latest release. Drafts and pre-releases aren't accepted.
      placeholder: v1.0.0
    validations:
      required: false
  - type: input
    id: description
    attributes:
      label: Short description
      description: One line for the registry, 160 characters at most.
      placeholder: Plays .xyz files on the console, with USB pads.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      description: A plugin is listed only if all of these are true.
      options:
        - label: The plugin is a free download. It isn't sold, and it isn't bundled with the cart or with anything that is sold.
          required: true
        - label: The repository is public and holds the plugin's full source, including the source of everything it links (GPL and LGPL code requires it).
          required: true
        - label: The repository has a LICENSE file. Code licensed for non-commercial use only is fine.
          required: true
        - label: The README credits the people whose work the plugin uses and links to the full source.
          required: true
        - label: The repository and the release, its screenshots included, contain no commercial game art, ROMs or other files I don't have the right to share.
          required: true
        - label: The registry may copy this release's README, release notes and screenshots, and show them on the plugin's page.
          required: true
