name: Submit a plugin
description: Add your Parrot Cart plugin to the registry, or another plugin from the same repo.
title: "Plugin: "
labels: ["plugin-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which GitHub repo your plugin is in. We'll check your latest
        release and reply here. If it passes, we'll add your plugin to the
        registry. We only read your files; we never run anything.

        After that, new releases are picked up automatically.

        Your plugin's page shows your README, your release notes and up to
        three screenshots. Attach them to the release as `screenshot-1.png`,
        `screenshot-2.png` and `screenshot-3.png` (PNG, 256 × 192, 100 KB max
        each).

        More details: https://plasticbugs.github.io/parrot-cart-plugins/authors/
  - type: input
    id: repo
    attributes:
      label: Repository
      description: owner/repo on GitHub. It must be public.
      placeholder: yourname/your-plugin
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Release tag
      description: Leave empty to use your latest release. Drafts and pre-releases aren't accepted.
      placeholder: v1.0.0
    validations:
      required: false
  - type: input
    id: description
    attributes:
      label: Short description
      description: One line about your plugin, up to 160 characters.
      placeholder: Plays .xyz files on the console, with USB pads.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      description: We can only list your plugin if all of these are true.
      options:
        - label: The plugin is free. It isn't sold, and it isn't bundled with the cart or anything else that's sold.
          required: true
        - label: The repo is public and has the plugin's full source, including any code it links in. GPL and LGPL code requires this.
          required: true
        - label: The repo has a LICENSE file. A non-commercial licence is fine.
          required: true
        - label: The README credits the people whose work the plugin uses, and links to the full source.
          required: true
        - label: The repo and the release, including screenshots, have no commercial game art, ROMs or other files I don't have the right to share.
          required: true
        - label: The registry may copy this release's README, release notes and screenshots and show them on the plugin's page.
          required: true
