# The tests, the workflow lint, the entries and a site build, on every pull
# request and push. On a pull request that adds or changes an entry, the
# entry is checked against its release on GitHub too (verify_pr.sh). The
# token is read-only; pull requests from forks run with no secrets.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unit and end-to-end tests (offline)
        run: python3 -I -m unittest discover -s tests -v
      - name: Workflow lint
        run: python3 -I tests/lint_workflows.py
      - name: Entries
        run: python3 -I tools/registry.py check
      - name: Site
        run: python3 -I tools/build_site.py --out _site
      - name: Entries match their releases
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci/verify_pr.sh
